name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run tokens:check
      - name: The CV's LaTeX source matches the resume
        run: bun run cv --check

  image:
    uses: zyx1121/.github/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '[{"name": "ghcr.io/zyx-tw/www"}]'
      smoke: bash deploy/smoke.sh
    secrets:
      # Classic token, no scopes: the heatmap counts private contributions.
      build-env: '{"github_token": ${{ toJSON(secrets.HEATMAP_GITHUB_TOKEN) }}}'

  promote:
    needs: [check, image]
    uses: zyx1121/.github/.github/workflows/promote.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '["ghcr.io/zyx-tw/www"]'
