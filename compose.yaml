# The zyx.tw apps. The pull request builds each image; a merge ships them to
# the host through land, which runs deploy/carrel-start.sh to set every
# *_VERSION to the release and restart the stack. Ports and image tags go in
# .env next to this file, each app's own settings in env/<app>.env (see
# .env.example and apps/<app>/.env.example). Every env/<app>.env is optional,
# so a missing one never blocks the other apps.
x-app: &app
  restart: unless-stopped
  init: true
  stop_grace_period: 3s

services:
  web:
    <<: *app
    image: ghcr.io/zyx1121/www.zyx.tw:${WEB_VERSION:-main}
    env_file: .env
    ports:
      - "${WEB_BIND:-127.0.0.1:3000}:3000"

  ui:
    <<: *app
    image: ghcr.io/zyx1121/ui.zyx.tw:${UI_VERSION:-main}
    ports:
      - "${UI_BIND:-127.0.0.1:3001}:3000"

  3d:
    <<: *app
    image: ghcr.io/zyx1121/3d.zyx.tw:${PLUMP_VERSION:-main}
    env_file:
      - path: env/3d.env
        required: false
    ports:
      - "${PLUMP_BIND:-127.0.0.1:3006}:3000"
