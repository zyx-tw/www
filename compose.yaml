# www on Docker Compose: one web container.
#
#   cp .env.example .env      # set DATABASE_URL
#   docker compose up -d
#
# The web port binds to 127.0.0.1: put a reverse proxy with TLS in front.
name: www-zyx-tw

services:
  web:
    image: ghcr.io/zyx-tw/www:${WEB_VERSION:-latest}
    init: true
    stop_grace_period: 3s
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${WEB_BIND:-127.0.0.1:3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/icon.svg"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
